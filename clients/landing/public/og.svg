<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C5E06B"/><stop offset="1" stop-color="#93B82E"/>
    </linearGradient>
    <radialGradient id="glowL" cx="80%" cy="8%" r="60%">
      <stop offset="0" stop-color="#A8CC3C" stop-opacity="0.28"/><stop offset="1" stop-color="#A8CC3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="6%" cy="100%" r="55%">
      <stop offset="0" stop-color="#00D4AA" stop-opacity="0.18"/><stop offset="1" stop-color="#00D4AA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8CC3C"/><stop offset="1" stop-color="#00D4AA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0c12"/>
  <rect width="1200" height="630" fill="url(#glowL)"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- circadian ring motif, right -->
  <g transform="translate(940 315)" opacity="0.9">
    <circle r="170" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <circle r="170" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="800 1068" transform="rotate(-90)"/>
    <circle r="110" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" font-size="56" font-weight="700" fill="#A8CC3C">24h</text>
    <text x="0" y="34" text-anchor="middle" font-size="22" font-weight="600" fill="#9ba3b4" font-family="'Barlow',Arial,sans-serif">body clock</text>
  </g>

  <!-- brand mark + wordmark -->
  <g transform="translate(90 96)">
    <rect width="92" height="92" rx="26" fill="url(#tile)"/>
    <path d="M28 33h36l-27 30h27" fill="none" stroke="#0a0c12" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="65" cy="27" r="6" fill="#0a0c12"/>
    <text x="116" y="70" font-size="74" font-weight="700" letter-spacing="1" fill="#f4f6fb">Zeitra</text>
  </g>

  <!-- tagline -->
  <text x="92" y="318" font-size="40" font-weight="600" letter-spacing="3" fill="#A8CC3C" font-family="'Barlow',Arial,sans-serif">STRONG TODAY. BETTER EVERYDAY.</text>
  <text x="88" y="420" font-size="72" font-weight="700" fill="#f4f6fb">Meals, workouts &amp; sleep</text>
  <text x="88" y="500" font-size="72" font-weight="700" fill="#f4f6fb">on <tspan fill="#A8CC3C">your shift</tspan> — not a 9-to-5.</text>

  <text x="92" y="586" font-size="28" font-weight="500" fill="#9ba3b4" font-family="'Barlow',Arial,sans-serif">Chrono-nutrition for shift workers · zeitra.app</text>
</svg>
