<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitra — Quick add</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05060a;font-family:'Saira',-apple-system,sans-serif;display:flex;justify-content:center;padding:24px 12px;min-height:100vh}
  :root{--bg:#0A0C12;--cd:#15181F;--bd:#252A33;--lm:#C2F03C;--tx:#F4F6FB;--mu:#8B919E}
  .frame{width:340px;background:var(--bg);border-radius:40px;border:8px solid #1b1e25;overflow:hidden;position:relative;height:760px}
  .tile{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:15px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:9px}
  .tile img{width:54px;height:54px;object-fit:contain}
  .tile span{color:var(--tx);font-size:13px;font-weight:500;letter-spacing:-0.1px}
</style>
</head>
<body>
<div class="frame">
  <!-- dimmed backdrop with a faint hint of the screen behind -->
  <div style="position:absolute;inset:0;background:#06070b"></div>
  <div style="position:absolute;top:56px;left:18px;right:18px;height:200px;border-radius:18px;background:var(--cd);opacity:0.35"></div>
  <div style="position:absolute;top:274px;left:18px;width:150px;height:36px;border-radius:12px;background:var(--cd);opacity:0.3"></div>
  <!-- status bar over backdrop -->
  <div style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:9px 20px 2px;color:#8B919E88;font-size:11px;z-index:5"><span style="color:#F4F6FB88;font-weight:500">9:41</span><span style="display:flex;gap:7px"><i class="ti ti-antenna-bars-5"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></span></div>

  <!-- BOTTOM SHEET -->
  <div style="position:absolute;bottom:0;left:0;right:0;background:var(--bg);border:1px solid var(--bd);border-bottom:none;border-radius:28px 28px 0 0;padding:12px 18px 24px;box-shadow:0 -12px 40px #0008">
    <!-- grab handle -->
    <div style="width:40px;height:5px;border-radius:3px;background:#3a3f49;margin:0 auto 18px"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <span style="color:var(--tx);font-size:22px;font-weight:600;letter-spacing:-0.4px">Quick add</span>
      <div style="width:32px;height:32px;border-radius:50%;background:var(--cd);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center"><i class="ti ti-x" style="color:var(--mu);font-size:17px"></i></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
      <div class="tile"><img src="ready/qa-meal.png" alt=""><span>Meal</span></div>
      <div class="tile"><img src="ready/qa-workout.png" alt=""><span>Workout</span></div>
      <div class="tile"><img src="ready/meal-hydration.png" alt=""><span>Water</span></div>
      <div class="tile"><img src="ready/qa-sleep.png" alt=""><span>Sleep</span></div>
      <div class="tile"><img src="ready/qa-stats.png" alt=""><span>Weight</span></div>
      <div class="tile"><img src="ready/qa-cycle.png" alt=""><span>Cycle</span></div>
    </div>

    <div style="background:var(--lm);color:#13200a;font-size:15px;font-weight:600;padding:15px;border-radius:16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:20px;letter-spacing:-0.2px"><i class="ti ti-camera" style="font-size:20px"></i>Scan a meal</div>
    <div style="text-align:center;color:var(--mu);font-size:13px;font-weight:500;margin-top:14px">or just tell Ria — "I had a chicken bowl"</div>
  </div>
</div>
</body>
</html>
