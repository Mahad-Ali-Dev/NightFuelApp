<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitra — Blush theme</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1a1216;font-family:'Saira',-apple-system,sans-serif;display:flex;justify-content:center;padding:24px 12px;min-height:100vh}
  :root{--bg:#FBF2F5;--sf:#FFFFFF;--bd:#F2DCE4;--ac:#EC6F9E;--ink:#FFFFFF;--tx:#2A1D24;--mu:#9D8089;--sh:0 6px 20px #EC6F9E1f}
  .frame{width:340px;background:var(--bg);border-radius:40px;border:8px solid #F2DCE4;overflow:hidden;position:relative;height:760px}
  .scroll{height:100%;overflow-y:auto}.scroll::-webkit-scrollbar{display:none}
  .card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh)}
  .st{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:13px 8px;text-align:center}
</style>
</head>
<body>
<div class="frame"><div class="scroll">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 20px 2px;color:var(--mu);font-size:11px"><span style="color:var(--tx);font-weight:600">9:41</span><span style="display:flex;gap:7px"><i class="ti ti-antenna-bars-5"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></span></div>

  <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px 4px">
    <div><div style="color:var(--mu);font-size:13px">Good evening 🌙</div><div style="color:var(--tx);font-size:22px;font-weight:600">Maya</div></div>
    <div style="display:flex;align-items:center;gap:12px"><div style="position:relative"><i class="ti ti-bell" style="color:var(--tx);font-size:22px"></i><span style="position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--ac);border:1.5px solid var(--bg)"></span></div><div style="width:40px;height:40px;border-radius:50%;background:#FCE3EC;border:1.5px solid var(--ac);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600">M</div></div>
  </div>

  <div style="padding:6px 16px 0"><span style="display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);color:var(--tx);font-size:12px;font-weight:500;padding:7px 13px;border-radius:20px">🌙 Night shift · 3h in · follicular day 9</span></div>

  <div style="padding:14px 16px 0"><div class="card" style="position:relative;overflow:hidden;height:148px;display:flex;align-items:flex-end">
    <img src="ready/hero-female-1.png" style="position:absolute;right:-18px;bottom:0;height:160px;width:auto;object-fit:contain">
    <div style="position:relative;padding:15px 16px"><span style="background:var(--ac);color:var(--ink);font-size:9px;font-weight:700;padding:3px 9px;border-radius:10px;letter-spacing:0.5px">TONIGHT'S WORKOUT</span><div style="color:var(--tx);font-size:19px;font-weight:600;margin-top:9px">Full Body Blast</div><div style="color:var(--mu);font-size:12px;margin-top:1px">45 min · timed to 23:00</div><div style="display:inline-flex;align-items:center;gap:6px;background:var(--ac);color:var(--ink);font-size:13px;font-weight:600;padding:8px 15px;border-radius:11px;margin-top:11px"><i class="ti ti-player-play" style="font-size:15px"></i>Start</div></div>
  </div></div>

  <div style="display:flex;gap:10px;padding:13px 16px 0">
    <div class="st"><i class="ti ti-flame" style="color:var(--ac);font-size:20px"></i><div style="color:var(--tx);font-size:17px;font-weight:600;margin-top:3px">540</div><div style="color:var(--mu);font-size:10px">kcal</div></div>
    <div class="st"><i class="ti ti-droplet" style="color:var(--ac);font-size:20px"></i><div style="color:var(--tx);font-size:17px;font-weight:600;margin-top:3px">1.4L</div><div style="color:var(--mu);font-size:10px">water</div></div>
    <div class="st"><i class="ti ti-shoe" style="color:var(--ac);font-size:20px"></i><div style="color:var(--tx);font-size:17px;font-weight:600;margin-top:3px">6.2k</div><div style="color:var(--mu);font-size:10px">steps</div></div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;padding:22px 18px 12px"><span style="color:var(--tx);font-size:16px;font-weight:600">Picked for your shift</span><span style="color:var(--ac);font-size:12px;font-weight:500">See all</span></div>
  <div style="display:flex;gap:12px;padding:0 0 0 16px;overflow:hidden">
    <div style="min-width:150px;flex-shrink:0"><div class="card" style="height:104px;display:flex;align-items:center;justify-content:center"><img src="ready/meal-lunch.png" style="width:90px;height:90px;object-fit:contain"></div><div style="color:var(--tx);font-size:13px;font-weight:500;margin-top:8px">Pre‑shift bowl</div><div style="color:var(--mu);font-size:11px">620 kcal · 20 min</div></div>
    <div style="min-width:150px;flex-shrink:0"><div class="card" style="height:104px;display:flex;align-items:center;justify-content:center"><img src="ready/qa-cycle.png" style="width:84px;height:84px;object-fit:contain"></div><div style="color:var(--tx);font-size:13px;font-weight:500;margin-top:8px">Cycle check‑in</div><div style="color:var(--mu);font-size:11px">Day 9 · follicular</div></div>
  </div>
  <div style="height:100px"></div>
</div>

<div style="position:absolute;bottom:12px;left:12px;right:12px;height:60px;background:var(--sf);border:1px solid var(--bd);border-radius:26px;box-shadow:0 10px 26px #EC6F9E2b;display:flex;align-items:center;justify-content:space-around;padding:0 16px">
  <div style="color:var(--ac);display:flex;flex-direction:column;align-items:center;gap:3px"><i class="ti ti-home" style="font-size:23px"></i><span style="font-size:10px;font-weight:600">Home</span></div>
  <i class="ti ti-tools-kitchen-2" style="color:var(--mu);font-size:23px"></i>
  <div style="width:48px;height:48px;border-radius:50%;background:var(--ac);color:var(--ink);display:flex;align-items:center;justify-content:center;margin-top:-24px;border:4px solid var(--bg);box-shadow:0 6px 15px #EC6F9E55"><i class="ti ti-plus" style="font-size:23px"></i></div>
  <i class="ti ti-barbell" style="color:var(--mu);font-size:23px"></i>
  <i class="ti ti-user" style="color:var(--mu);font-size:23px"></i>
</div>
</div>
</body>
</html>
