<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitra — Sleep schedule</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05060a;font-family:'Saira',-apple-system,sans-serif;display:flex;justify-content:center;padding:24px 12px;min-height:100vh}
  :root{--bg:#0A0C12;--cd:#15181F;--bd:#252A33;--lm:#C2F03C;--ink:#13200a;--tx:#F4F6FB;--mu:#8B919E}
  .frame{width:340px;background:var(--bg);border-radius:40px;border:8px solid #1b1e25;overflow:hidden;position:relative;height:760px}
  .time{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:15px;margin-top:14px}
  .time .ic{width:50px;height:50px;border-radius:14px;background:#1e222b;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .time .ic i{color:var(--lm);font-size:25px}
</style>
</head>
<body>
<div class="frame">
  <!-- status bar -->
  <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 20px 2px;color:var(--mu);font-size:11px"><span style="color:var(--tx);font-weight:500">9:41</span><span style="display:flex;gap:7px"><i class="ti ti-antenna-bars-5"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></span></div>

  <!-- nav + progress -->
  <div style="display:flex;align-items:center;gap:14px;padding:14px 20px 0">
    <i class="ti ti-chevron-left" style="color:var(--tx);font-size:22px"></i>
    <div style="flex:1;display:flex;gap:6px"><div style="flex:1;height:5px;border-radius:3px;background:var(--lm)"></div><div style="flex:1;height:5px;border-radius:3px;background:var(--lm)"></div><div style="flex:1;height:5px;border-radius:3px;background:var(--lm)"></div><div style="flex:1;height:5px;border-radius:3px;background:var(--lm)"></div></div>
    <span style="color:var(--mu);font-size:13px;font-weight:500">4/4</span>
  </div>

  <div style="padding:26px 20px 0">
    <div style="color:var(--tx);font-size:27px;font-weight:700;line-height:1.15;letter-spacing:-0.6px">When do you<br>usually sleep?</div>
    <div style="color:var(--mu);font-size:15px;font-weight:400;line-height:1.5;margin-top:10px">After a night shift, most rest through the morning. We'll protect this window from reminders.</div>

    <div class="time"><div class="ic"><i class="ti ti-moon"></i></div><div style="flex:1"><div style="color:var(--mu);font-size:13px;font-weight:500">Sleep at</div><div style="color:var(--tx);font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-0.6px;margin-top:1px">08:00</div></div><i class="ti ti-chevron-down" style="color:var(--mu);font-size:18px"></i></div>
    <div class="time"><div class="ic"><i class="ti ti-sun"></i></div><div style="flex:1"><div style="color:var(--mu);font-size:13px;font-weight:500">Wake at</div><div style="color:var(--tx);font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-0.6px;margin-top:1px">15:00</div></div><i class="ti ti-chevron-down" style="color:var(--mu);font-size:18px"></i></div>

    <div style="display:flex;align-items:center;gap:11px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px 15px;margin-top:18px"><i class="ti ti-bulb" style="color:var(--lm);font-size:21px;flex-shrink:0"></i><span style="color:#d4d5d9;font-size:13px;font-weight:400;line-height:1.45">That's a <b style="color:var(--lm);font-weight:600">7-hour</b> sleep window. Looks healthy for a night rotation.</span></div>
  </div>

  <div style="position:absolute;bottom:0;left:0;right:0;padding:18px 20px 30px;background:linear-gradient(180deg,transparent,var(--bg) 32%)"><div style="background:var(--lm);color:var(--ink);font-size:16px;font-weight:600;padding:17px;border-radius:15px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px"><i class="ti ti-sparkles" style="font-size:19px"></i>Build my plan</div></div>
</div>
</body>
</html>
