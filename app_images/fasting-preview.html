<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitra — Fasting</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05060a;font-family:'Saira',-apple-system,sans-serif;display:flex;justify-content:center;padding:24px 12px;min-height:100vh}
  :root{--bg:#0A0C12;--cd:#15181F;--bd:#252A33;--lm:#C2F03C;--am:#FFB13C;--tx:#F4F6FB;--mu:#8B919E}
  .frame{width:340px;background:var(--bg);border-radius:40px;border:8px solid #1b1e25;overflow:hidden;position:relative;height:760px}
  .scroll{height:100%;overflow-y:auto}.scroll::-webkit-scrollbar{display:none}
  .zc{background:var(--cd);border:1px solid var(--bd);border-radius:16px}
</style>
</head>
<body>
<div class="frame"><div class="scroll" style="padding-bottom:24px">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 20px 2px;color:var(--mu);font-size:11px"><span style="color:var(--tx);font-weight:500">9:41</span><span style="display:flex;gap:7px"><i class="ti ti-antenna-bars-5"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></span></div>

  <!-- back-chevron header -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:38px;height:38px;border-radius:50%;background:var(--cd);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center"><i class="ti ti-chevron-left" style="color:var(--tx);font-size:21px"></i></div>
      <span style="color:var(--tx);font-size:19px;font-weight:600;letter-spacing:-0.3px">Fasting</span>
    </div>
    <div style="width:38px;height:38px;border-radius:50%;background:var(--cd);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center"><i class="ti ti-history" style="color:var(--tx);font-size:20px"></i></div>
  </div>

  <!-- ring hero -->
  <div style="display:flex;flex-direction:column;align-items:center;padding:20px 0 6px">
    <div style="position:relative;width:248px;height:248px">
      <svg viewBox="0 0 248 248" width="248" height="248">
        <defs><linearGradient id="am" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC36B"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
        <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <circle cx="124" cy="124" r="108" fill="none" stroke="#252A33" stroke-width="12"/>
        <circle cx="124" cy="124" r="108" fill="none" stroke="url(#am)" stroke-width="12" stroke-linecap="round" stroke-dasharray="678" stroke-dashoffset="224" transform="rotate(-90 124 124)" filter="url(#g)"/>
      </svg>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center">
        <div style="color:var(--am);font-size:11px;font-weight:600;letter-spacing:1.4px"><i class="ti ti-flame" style="font-size:13px;position:relative;top:1px"></i> 16:8 · FAT BURN</div>
        <div style="color:var(--tx);font-size:50px;font-weight:600;letter-spacing:-1.5px;line-height:1.05;margin-top:4px">11:42</div>
        <div style="color:var(--mu);font-size:13px;font-weight:500;margin-top:2px">elapsed of 16h · 67%</div>
      </div>
    </div>
    <!-- stage row -->
    <div style="display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--mu);font-size:12px;font-weight:500">
      <span>Fed</span><span style="width:22px;height:2px;background:var(--am);border-radius:2px"></span><span style="color:var(--am);font-weight:600">Fat burn</span><span style="width:22px;height:2px;background:var(--bd);border-radius:2px"></span><span>Ketosis</span>
    </div>
  </div>

  <!-- stat row -->
  <div style="display:flex;gap:11px;padding:20px 16px 0">
    <div class="zc" style="flex:1;padding:13px;text-align:center"><div style="color:var(--mu);font-size:11px;font-weight:500">Target</div><div style="color:var(--tx);font-size:18px;font-weight:600;margin-top:3px;letter-spacing:-0.3px">16h</div></div>
    <div class="zc" style="flex:1;padding:13px;text-align:center"><div style="color:var(--mu);font-size:11px;font-weight:500">Remaining</div><div style="color:var(--tx);font-size:18px;font-weight:600;margin-top:3px;letter-spacing:-0.3px">4:18</div></div>
    <div class="zc" style="flex:1;padding:13px;text-align:center"><div style="color:var(--mu);font-size:11px;font-weight:500">Ends at</div><div style="color:var(--tx);font-size:18px;font-weight:600;margin-top:3px;letter-spacing:-0.3px">13:30</div></div>
  </div>

  <!-- next meal -->
  <div style="padding:16px 16px 0"><div class="zc" style="display:flex;align-items:center;gap:14px;padding:0;overflow:hidden">
    <div style="width:72px;height:72px;flex-shrink:0;overflow:hidden"><img src="ready/meal-recovery.png" style="width:100%;height:100%;object-fit:cover"></div>
    <div style="flex:1;padding:11px 0"><div style="color:var(--lm);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px">Breaks fast · 13:30</div><div style="color:var(--tx);font-size:16px;font-weight:600;margin-top:2px;letter-spacing:-0.2px">Recovery bowl</div><div style="color:var(--mu);font-size:12.5px;font-weight:400">540 kcal · high protein</div></div>
    <i class="ti ti-chevron-right" style="color:#55555c;font-size:19px;margin-right:14px"></i>
  </div></div>

  <!-- protocol -->
  <div style="display:flex;gap:10px;padding:16px 16px 0">
    <div style="flex:1;background:var(--cd);border:1.5px solid var(--am);border-radius:14px;padding:12px;text-align:center"><div style="color:var(--tx);font-size:15px;font-weight:600;letter-spacing:-0.2px">16:8</div><div style="color:var(--am);font-size:11px;font-weight:500;margin-top:1px">Current</div></div>
    <div class="zc" style="flex:1;padding:12px;text-align:center;border-radius:14px"><div style="color:var(--tx);font-size:15px;font-weight:600;letter-spacing:-0.2px">18:6</div><div style="color:var(--mu);font-size:11px;font-weight:400;margin-top:1px">Switch</div></div>
    <div class="zc" style="flex:1;padding:12px;text-align:center;border-radius:14px"><div style="color:var(--tx);font-size:15px;font-weight:600;letter-spacing:-0.2px">20:4</div><div style="color:var(--mu);font-size:11px;font-weight:400;margin-top:1px">Switch</div></div>
  </div>

  <div style="padding:18px 16px 0"><div style="text-align:center;color:var(--mu);font-size:14px;font-weight:500;padding:13px">End fast early</div></div>
</div></div>
</body>
</html>
