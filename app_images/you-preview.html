<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitra — Profile</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05060a;font-family:'Saira',-apple-system,sans-serif;display:flex;justify-content:center;padding:24px 12px;min-height:100vh}
  :root{--bg:#0A0C12;--cd:#15181F;--bd:#252A33;--lm:#C2F03C;--tx:#F4F6FB;--mu:#8B919E}
  .frame{width:340px;background:var(--bg);border-radius:40px;border:8px solid #1b1e25;overflow:hidden;position:relative;height:760px}
  .scroll{height:100%;overflow-y:auto}.scroll::-webkit-scrollbar{display:none}
  .zc{background:var(--cd);border:1px solid var(--bd);border-radius:16px}
  .ach{text-align:center}
  .ach .ic{width:100%;aspect-ratio:1;border-radius:16px;background:var(--cd);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}
  .ach .lbl{color:var(--mu);font-size:11px;font-weight:500;margin-top:7px}
  .ria{position:absolute;right:0;top:300px;z-index:5;background:var(--lm);color:#13200a;width:44px;padding:11px 0;border-radius:16px 0 0 16px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 4px 16px #0008}
</style>
</head>
<body>
<div class="frame"><div class="scroll" style="padding-bottom:96px">
  <!-- cover hero (model bg) -->
  <div style="position:relative;height:160px">
    <img src="ready/hero-male-1.png" style="position:absolute;right:4px;top:0;height:100%;width:auto;object-fit:cover;filter:grayscale(1) contrast(1.05);opacity:0.55">
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,#0A0C1255 0%,#0A0C12cc 68%,#0A0C12 100%)"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(102deg,#0A0C12 28%,transparent 92%)"></div>
    <div style="position:relative;display:flex;justify-content:space-between;align-items:center;padding:9px 20px 2px;color:var(--mu);font-size:11px"><span style="color:var(--tx);font-weight:500">9:41</span><span style="display:flex;gap:7px"><i class="ti ti-antenna-bars-5"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></span></div>
    <div style="position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 18px">
      <div style="width:38px;height:38px;border-radius:50%;background:#15181Fcc;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center"><i class="ti ti-share-3" style="color:var(--tx);font-size:18px"></i></div>
      <div style="width:38px;height:38px;border-radius:50%;background:#15181Fcc;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center"><i class="ti ti-settings" style="color:var(--tx);font-size:19px"></i></div>
    </div>
  </div>

  <!-- avatar + identity (overlapping cover) -->
  <div style="text-align:center;margin-top:-48px;position:relative">
    <div style="position:relative;width:108px;height:108px;margin:0 auto">
      <svg viewBox="0 0 108 108" width="108" height="108" style="position:absolute;inset:0">
        <circle cx="54" cy="54" r="50" fill="none" stroke="#26282f" stroke-width="4.5"/>
        <circle cx="54" cy="54" r="50" fill="none" stroke="#C2F03C" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="56" transform="rotate(-90 54 54)"/>
      </svg>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:#1c2a0e;border:3px solid var(--bg);color:var(--lm);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700">A</div>
      <div style="position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);background:var(--lm);color:#13200a;font-size:11px;font-weight:600;padding:3px 12px;border-radius:20px;border:2px solid var(--bg);letter-spacing:0.3px">LVL 7</div>
    </div>
    <div style="color:var(--tx);font-size:24px;font-weight:600;letter-spacing:-0.4px;margin-top:13px">Alex Carter</div>
    <div style="color:var(--mu);font-size:13px;font-weight:400;margin-top:3px"><i class="ti ti-moon" style="color:var(--lm);font-size:13px;position:relative;top:1px"></i> Night Owl · joined Mar 2026</div>
  </div>

  <!-- stat row -->
  <div style="padding:20px 16px 0"><div class="zc" style="display:flex;align-items:center;justify-content:space-around;padding:16px 14px">
    <div style="text-align:center"><div style="color:var(--lm);font-size:24px;font-weight:600;line-height:1;letter-spacing:-0.5px">12</div><div style="color:var(--mu);font-size:11.5px;margin-top:6px">Streak</div></div>
    <div style="width:1px;height:32px;background:var(--bd)"></div>
    <div style="text-align:center"><div style="color:var(--tx);font-size:24px;font-weight:600;line-height:1;letter-spacing:-0.5px">48</div><div style="color:var(--mu);font-size:11.5px;margin-top:6px">Workouts</div></div>
    <div style="width:1px;height:32px;background:var(--bd)"></div>
    <div style="text-align:center"><div style="color:var(--tx);font-size:24px;font-weight:600;line-height:1;letter-spacing:-0.5px">312</div><div style="color:var(--mu);font-size:11.5px;margin-top:6px">Meals</div></div>
  </div></div>

  <!-- achievements -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:24px 18px 12px"><span style="color:var(--tx);font-size:16px;font-weight:600">Achievements</span><span style="color:var(--mu);font-size:12.5px;display:flex;align-items:center;gap:2px">All<i class="ti ti-chevron-right" style="font-size:15px"></i></span></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:11px;padding:0 16px">
    <div class="ach"><div class="ic"><i class="ti ti-flame" style="color:var(--lm);font-size:26px"></i></div><div class="lbl">30-day</div></div>
    <div class="ach"><div class="ic"><i class="ti ti-moon-stars" style="color:var(--lm);font-size:26px"></i></div><div class="lbl">Night owl</div></div>
    <div class="ach"><div class="ic"><i class="ti ti-barbell" style="color:var(--lm);font-size:26px"></i></div><div class="lbl">Iron will</div></div>
    <div class="ach"><div class="ic" style="opacity:0.5"><i class="ti ti-lock" style="color:var(--mu);font-size:22px"></i></div><div class="lbl">Locked</div></div>
  </div>

  <!-- consistency heatmap -->
  <div style="padding:24px 18px 12px;color:var(--tx);font-size:16px;font-weight:600">Consistency</div>
  <div style="padding:0 16px"><div class="zc" style="padding:15px 14px"><div id="hm" style="display:grid;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;grid-auto-flow:column;gap:4px;justify-content:space-between"></div></div></div>

  <!-- menu -->
  <div style="padding:20px 16px 0"><div class="zc" style="overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid #1f232b"><span style="display:flex;align-items:center;gap:12px;color:var(--tx);font-size:14.5px;font-weight:500"><i class="ti ti-palette" style="color:var(--lm);font-size:19px"></i>Appearance &amp; theme</span><i class="ti ti-chevron-right" style="color:var(--mu);font-size:16px"></i></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid #1f232b"><span style="display:flex;align-items:center;gap:12px;color:var(--tx);font-size:14.5px;font-weight:500"><i class="ti ti-bell" style="color:var(--lm);font-size:19px"></i>Notifications</span><i class="ti ti-chevron-right" style="color:var(--mu);font-size:16px"></i></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 15px"><span style="display:flex;align-items:center;gap:12px;color:var(--tx);font-size:14.5px;font-weight:500"><i class="ti ti-user-cog" style="color:var(--lm);font-size:19px"></i>Account &amp; settings</span><i class="ti ti-chevron-right" style="color:var(--mu);font-size:16px"></i></div>
  </div></div>
</div>

<div class="ria"><i class="ti ti-message-circle" style="font-size:19px"></i><span style="font-size:10px;font-weight:500">Ria</span></div>
<div style="position:absolute;bottom:12px;left:12px;right:12px;height:60px;background:#15181F;border:1px solid #2a2f3a;border-radius:26px;box-shadow:0 12px 28px #000b;display:flex;align-items:center;justify-content:space-around;padding:0 16px">
  <div style="color:#7d828d;display:flex;flex-direction:column;align-items:center;gap:3px"><i class="ti ti-home" style="font-size:23px"></i><span style="font-size:10px">Home</span></div>
  <div style="color:#7d828d;display:flex;flex-direction:column;align-items:center;gap:3px"><i class="ti ti-tools-kitchen-2" style="font-size:23px"></i><span style="font-size:10px">Meals</span></div>
  <div style="color:#7d828d;display:flex;flex-direction:column;align-items:center;gap:3px"><i class="ti ti-plus" style="font-size:23px"></i><span style="font-size:10px">Add</span></div>
  <div style="color:#7d828d;display:flex;flex-direction:column;align-items:center;gap:3px"><i class="ti ti-barbell" style="font-size:23px"></i><span style="font-size:10px">Train</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:48px;height:48px;border-radius:50%;background:var(--lm);color:#13200a;display:flex;align-items:center;justify-content:center;margin-top:-24px;border:4px solid var(--bg);box-shadow:0 6px 15px #0009"><i class="ti ti-user" style="font-size:23px"></i></div><span style="font-size:10px;color:var(--lm);font-weight:500">You</span></div>
</div>
</div>
<script>(function(){var hm=document.getElementById('hm');if(!hm)return;var lv=['#1a1e26','#2e3b17','#5d8120','#92bb2f','#C2F03C'];var pat=[3,1,4,2,0,3,2,4,1,3,0,2,4,3,1,2,3,0,4,1,3,2,4,0,1,3,2,4,3,1,0,2,4,2,3,1,2,0,4,3,1,2,4,0,3,1,2,3];for(var i=0;i<105;i++){var d=document.createElement('div');d.style.background=lv[pat[i%pat.length]];d.style.borderRadius='3px';hm.appendChild(d);}})();</script>
</body>
</html>
