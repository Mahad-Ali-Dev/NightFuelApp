<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitra — Explore</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05060a;font-family:'Saira',-apple-system,sans-serif;display:flex;justify-content:center;padding:24px 12px;min-height:100vh}
  :root{--bg:#0A0C12;--cd:#15181F;--bd:#252A33;--lm:#C2F03C;--tx:#F4F6FB;--mu:#8B919E}
  .frame{width:340px;background:var(--bg);border-radius:40px;border:8px solid #1b1e25;overflow:hidden;position:relative;height:760px}
  .scroll{height:100%;overflow-y:auto}.scroll::-webkit-scrollbar,.mscroll::-webkit-scrollbar{display:none}
  .mscroll{overflow-x:auto;scrollbar-width:none}
  .zc{background:var(--cd);border:1px solid var(--bd);border-radius:16px}
  .chip{background:var(--cd);border:1px solid var(--bd);color:var(--tx);font-size:13px;font-weight:500;padding:8px 15px;border-radius:20px;white-space:nowrap;flex-shrink:0}
  .chip.on{background:var(--lm);border-color:var(--lm);color:#13200a;font-weight:600}
  .cat{position:relative;height:124px;border-radius:18px;overflow:hidden;background:var(--cd);border:1px solid var(--bd)}
  .cat img{position:absolute;right:6px;bottom:6px;width:84px;height:84px;object-fit:contain}
  .cat b{position:absolute;left:14px;top:13px;color:var(--tx);font-size:15px;font-weight:600;letter-spacing:-0.3px;max-width:96px;line-height:1.2}
  .ria{position:absolute;right:0;top:300px;z-index:5;background:var(--lm);color:#13200a;width:44px;padding:11px 0;border-radius:16px 0 0 16px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 4px 16px #0008}
</style>
</head>
<body>
<div class="frame"><div class="scroll" style="padding-bottom:104px">
  <!-- status bar -->
  <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 20px 2px;color:var(--mu);font-size:11px"><span style="color:var(--tx);font-weight:500">9:41</span><span style="display:flex;gap:7px"><i class="ti ti-antenna-bars-5"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></span></div>

  <!-- header -->
  <div style="padding:14px 18px 0"><div style="color:var(--tx);font-size:24px;font-weight:600;letter-spacing:-0.4px">Explore</div></div>

  <!-- search field -->
  <div style="padding:12px 16px 0"><div class="zc" style="padding:13px 15px;color:var(--mu);font-size:15px;display:flex;align-items:center;gap:10px"><i class="ti ti-search" style="font-size:19px"></i>Workouts, meals, exercises…</div></div>

  <!-- filter chips -->
  <div class="mscroll" style="display:flex;gap:10px;padding:16px 0 0 16px"><span class="chip on">For you</span><span class="chip">Workouts</span><span class="chip">Meals</span><span class="chip">Exercises</span><span class="chip">Recipes</span></div>

  <!-- featured hero -->
  <div style="padding:16px 16px 0">
    <div style="position:relative;height:178px;border-radius:18px;overflow:hidden;background:linear-gradient(150deg,#2b303a,#14171e)">
      <img src="ready/hero-male-3.png" style="position:absolute;right:-22px;bottom:0;height:182px;width:auto;object-fit:contain;transform:scaleX(-1)">
      <div style="position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 16%,transparent 78%)"></div>
      <div style="position:absolute;left:18px;bottom:18px;right:124px">
        <span style="background:var(--lm);color:#13200a;font-size:10px;font-weight:600;padding:4px 10px;border-radius:8px;letter-spacing:0.3px">TONIGHT'S PICK</span>
        <div style="color:#fff;font-size:22px;font-weight:600;margin-top:10px;line-height:1.1;letter-spacing:-0.5px">Night Shift HIIT</div>
        <div style="color:#cfd4dd;font-size:13px;margin-top:3px">20 min · timed to your dip</div>
      </div>
      <div style="position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:50%;background:var(--lm);display:flex;align-items:center;justify-content:center"><i class="ti ti-player-play" style="color:#13200a;font-size:19px;margin-left:2px"></i></div>
    </div>
  </div>

  <!-- browse grid -->
  <div style="color:var(--tx);font-size:16px;font-weight:600;padding:22px 18px 10px">Browse</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 16px">
    <div class="cat"><b>By muscle</b><img src="ready/muscle-back-male.png"></div>
    <div class="cat"><b>By goal</b><img src="ready/goal-muscle-gain.png"></div>
    <div class="cat"><b>Quick<br>under 15m</b><img src="ready/equip-bodyweight.png"></div>
    <div class="cat"><b>At home</b><img src="ready/cat-home.png"></div>
  </div>

  <!-- popular carousel -->
  <div style="color:var(--tx);font-size:16px;font-weight:600;padding:22px 18px 10px">Popular on nights</div>
  <div class="mscroll" style="display:flex;gap:12px;padding:0 0 0 16px">
    <div style="min-width:162px;flex-shrink:0"><div style="height:112px;border-radius:16px;background:var(--cd);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;overflow:hidden"><img src="ready/food-meat.png" style="width:104px;height:104px;object-fit:contain"></div><div style="color:var(--tx);font-size:14px;font-weight:600;margin-top:9px;letter-spacing:-0.2px">High-protein bowls</div><div style="color:var(--mu);font-size:12px">12 recipes</div></div>
    <div style="min-width:162px;flex-shrink:0"><div style="height:112px;border-radius:16px;background:var(--cd);border:1px solid var(--bd);display:flex;align-items:flex-end;justify-content:center;overflow:hidden"><img src="ready/muscle-core-male.png" style="height:120px;width:auto;object-fit:contain"></div><div style="color:var(--tx);font-size:14px;font-weight:600;margin-top:9px;letter-spacing:-0.2px">Core in 10</div><div style="color:var(--mu);font-size:12px">10 min · no kit</div></div>
    <div style="min-width:16px;flex-shrink:0"></div>
  </div>
  <div style="height:24px"></div>
</div>

<div class="ria"><i class="ti ti-message-circle" style="font-size:19px"></i><span style="font-size:10px;font-weight:500">Ria</span></div>
<div style="position:absolute;bottom:12px;left:12px;right:12px;height:60px;background:#15181F;border:1px solid #2a2f3a;border-radius:26px;box-shadow:0 12px 28px #000b;display:flex;align-items:center;justify-content:space-around;padding:0 16px">
  <div style="color:#7d828d;display:flex;flex-direction:column;align-items:center;gap:3px"><i class="ti ti-home" style="font-size:23px"></i><span style="font-size:10px">Home</span></div>
  <div style="color:#7d828d;display:flex;flex-direction:column;align-items:center;gap:3px"><i class="ti ti-tools-kitchen-2" style="font-size:23px"></i><span style="font-size:10px">Meals</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:48px;height:48px;border-radius:50%;background:var(--lm);color:#13200a;display:flex;align-items:center;justify-content:center;margin-top:-24px;border:4px solid var(--bg);box-shadow:0 6px 15px #0009"><i class="ti ti-plus" style="font-size:23px"></i></div><span style="font-size:10px;color:#7d828d">Add</span></div>
  <div style="color:#7d828d;display:flex;flex-direction:column;align-items:center;gap:3px"><i class="ti ti-barbell" style="font-size:23px"></i><span style="font-size:10px">Train</span></div>
  <div style="color:#7d828d;display:flex;flex-direction:column;align-items:center;gap:3px"><i class="ti ti-users" style="font-size:23px"></i><span style="font-size:10px">Crew</span></div>
</div>
</div>
</body>
</html>
