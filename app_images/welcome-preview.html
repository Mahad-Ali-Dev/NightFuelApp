<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitra — Welcome</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05060a;font-family:'Saira',-apple-system,sans-serif;display:flex;justify-content:center;padding:24px 12px;min-height:100vh}
  :root{--bg:#0A0C12;--cd:#15181F;--bd:#252A33;--lm:#C2F03C;--ink:#13200a;--tx:#F4F6FB;--mu:#8B919E}
  .frame{width:340px;background:var(--bg);border-radius:40px;border:8px solid #1b1e25;overflow:hidden;position:relative;height:760px}
</style>
</head>
<body>
<div class="frame">
  <!-- FULL-BLEED HERO PHOTO -->
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 32%,#2c3320 0%,#1a1d24 52%,#0A0C12 100%)"></div>
  <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:560px;display:flex;align-items:flex-end"><img src="ready/hero-male-1.png" style="height:100%;width:auto"></div>
  <!-- legibility gradient -->
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,#0A0C12cc 0%,transparent 24%,transparent 42%,#0A0C12e6 66%,#0A0C12 100%)"></div>

  <!-- status bar -->
  <div style="position:relative;display:flex;justify-content:space-between;align-items:center;padding:9px 20px 2px;color:var(--mu);font-size:11px"><span style="color:var(--tx);font-weight:500">9:41</span><span style="display:flex;gap:7px"><i class="ti ti-antenna-bars-5"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></span></div>

  <!-- wordmark -->
  <div style="position:relative;display:flex;flex-direction:column;align-items:center;padding-top:50px">
    <div style="display:inline-flex;align-items:center;gap:8px">
      <span style="font-weight:700;font-size:30px;color:#fff;letter-spacing:-0.5px">Z</span>
      <span style="display:inline-flex;flex-direction:column;gap:4px"><span style="width:20px;height:4px;border-radius:2px;background:var(--lm)"></span><span style="width:20px;height:4px;border-radius:2px;background:var(--lm)"></span><span style="width:20px;height:4px;border-radius:2px;background:var(--lm)"></span></span>
      <span style="font-weight:700;font-size:30px;color:#fff;letter-spacing:-0.5px">ITRA</span>
    </div>
    <div style="color:var(--mu);font-size:10px;font-weight:600;letter-spacing:2.5px;margin-top:12px">STRONG TODAY · BETTER EVERYDAY</div>
  </div>

  <!-- content -->
  <div style="position:absolute;bottom:0;left:0;right:0;padding:0 24px 40px;text-align:center">
    <div style="display:flex;justify-content:center;gap:6px;margin-bottom:24px"><span style="width:22px;height:6px;background:var(--lm);border-radius:3px"></span><span style="width:6px;height:6px;background:rgba(255,255,255,0.28);border-radius:50%"></span><span style="width:6px;height:6px;background:rgba(255,255,255,0.28);border-radius:50%"></span></div>
    <div style="color:#fff;font-size:31px;font-weight:700;line-height:1.12;letter-spacing:-0.6px">Fitness that runs<br>on your rhythm</div>
    <div style="color:#c7c9cf;font-size:14px;font-weight:400;line-height:1.5;margin-top:14px;padding:0 6px">Eat, train and sleep in sync with your body — your schedule, your energy, even your cycle.</div>
    <div style="background:var(--lm);color:var(--ink);font-size:16px;font-weight:600;padding:16px;border-radius:15px;margin-top:26px">Get started</div>
    <div style="color:#c7c9cf;font-size:14px;font-weight:400;margin-top:18px">Already have an account? <span style="color:var(--lm);font-weight:600">Sign in</span></div>
  </div>
</div>
</body>
</html>
