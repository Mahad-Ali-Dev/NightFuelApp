version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    # No host port exposure — only the internal Docker network reaches Postgres.
    # (Avoids clashing with any existing DB on the host and is safer.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Without this, a Docker daemon restart (e.g. unattended-upgrades upgrading
    # docker/containerd, or a reboot) leaves Postgres DOWN while the app services
    # — which DO carry restart:unless-stopped — come back and crash-loop on
    # `P1001 Can't reach postgres`. Match the services so the datastore returns too.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No host port exposure — internal Docker network only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Same reason as postgres above: survive a daemon restart / reboot so the
    # services that depend on Redis don't crash-loop after an auto-upgrade.
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Host port 8080 -> gateway. Avoids the host's existing nginx on 80/443.
    # Front this with the host nginx (subdomain -> localhost:8080) for HTTPS.
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - user-service
      - shift-service
      - circadian-engine
      - ai-pipeline
      - plan-service
      - meal-service
      - progress-service
      - exercise-service
      - sleep-service
      - notification-service
      - subscription-service
      - community-service
      - chat-service
      - state-service
      - decision-engine
    restart: unless-stopped

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Dockerfile
    # F34 #2: bind to localhost only. Sibling services + nginx reach this over
    # the internal Docker network by service-name (http://auth-service:3001), so
    # the host port is needed ONLY for local debugging — exposing it on 0.0.0.0
    # let anyone on the host network bypass the nginx edge (incl. its /internal
    # 404 gate). Follows the postgres/redis "internal-only" precedent above.
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_auth?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_auth?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # F36 GDPR purge: verifies X-Internal-Token on DELETE /internal/user/:userId.
      # Shared INTERNAL_SERVICE_TOKEN across services; guard fails closed if empty.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  shift-service:
    build:
      context: ../../
      dockerfile: services/shift-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://shift-service:3002).
      - "127.0.0.1:3002:3002"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_shifts?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_shifts?schema=public
      REDIS_URL: redis://redis:6379
      SHIFT_PORT: 3002
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # F35a / GDPR purge: authorizes this service's /v1/shifts/internal/* routes
      # (X-Internal-Token). Same INTERNAL_SERVICE_TOKEN value shared across services.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  circadian-engine:
    build:
      context: ../../services/circadian-engine
      dockerfile: Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://circadian-engine:3003).
      - "127.0.0.1:3003:3003"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3003
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-pipeline:
    build:
      context: ../../services/ai-pipeline
      dockerfile: Dockerfile
    ports:
      # F34 #2: localhost-only. nginx proxies /v1/ai -> http://ai-pipeline:3004
      # over the internal network; the public edge is nginx (8080) only.
      - "127.0.0.1:3004:3004"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3004
      # F22 #8 dual-auth: verify end-user Bearer JWTs (shared JWT_SECRET) and
      # trusted server-to-server callers (INTERNAL_SERVICE_TOKEN). The same
      # INTERNAL_SERVICE_TOKEN value is shared with chat/exercise/plan/progress.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-mock-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-key}
      # Optional LLM tuning (all default safely when unset). Set in infra/docker/.env:
      #   OPENAI_BASE_URL — point the OpenAI branch at a budget/self-hosted
      #     OpenAI-compatible endpoint (DeepSeek/Groq/Ollama/vLLM); unset => OpenAI cloud.
      #   *_MODEL / *_MODEL_FAST — override the model ids per tier.
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_MODEL_FAST: ${ANTHROPIC_MODEL_FAST:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_MODEL_FAST: ${OPENAI_MODEL_FAST:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      circadian-engine:
        condition: service_started
    restart: unless-stopped

  plan-service:
    build:
      context: ../../
      dockerfile: services/plan-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://plan-service:3005).
      - "127.0.0.1:3005:3005"
    environment:
      PLAN_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_plans?schema=public
      PLAN_DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_plans?schema=public
      # @nightfuel/config's loadConfig validates process.env.DATABASE_URL; Prisma reads PLAN_DATABASE_URL.
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_plans?schema=public
      REDIS_URL: redis://redis:6379
      PLAN_PORT: 3005
      AI_PIPELINE_URL: http://ai-pipeline:3004
      USER_SERVICE_URL: http://user-service:3009
      STATE_SERVICE_URL: http://state-service:3015
      DECISION_ENGINE_URL: http://decision-engine:3016
      MEAL_SERVICE_URL: http://meal-service:3006
      EXERCISE_SERVICE_URL: http://exercise-service:3011
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # F22 #8: shared token authorizing the server-to-server call to ai-pipeline.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-pipeline:
        condition: service_started
    restart: unless-stopped

  meal-service:
    build:
      context: ../../
      dockerfile: services/meal-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://meal-service:3006).
      - "127.0.0.1:3006:3006"
    environment:
      MEAL_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_meals?schema=public
      MEAL_DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_meals?schema=public
      # @nightfuel/config's loadConfig validates process.env.DATABASE_URL; Prisma reads MEAL_DATABASE_URL.
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_meals?schema=public
      REDIS_URL: redis://redis:6379
      MEAL_PORT: 3006
      PLAN_SERVICE_URL: http://plan-service:3005
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # F34 #5: sent as X-Internal-Token on the s2s call to plan-service
      # /v1/plans/internal/active/:userId (now guarded in-service).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: ../../
      dockerfile: services/user-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://user-service:3009).
      - "127.0.0.1:3009:3009"
    environment:
      USER_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_users?schema=public
      USER_DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_users?schema=public
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_users?schema=public
      REDIS_URL: redis://redis:6379
      USER_PORT: 3009
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # F34 #5: user-service OWNS /v1/users/internal/* (profile/preferences/
      # status/all). It verifies this token via the in-service guard; callers
      # (chat/plan/progress) send the same value.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  progress-service:
    build:
      context: ../../
      dockerfile: services/progress-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://progress-service:3007).
      - "127.0.0.1:3007:3007"
    environment:
      PROGRESS_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_progress?schema=public
      PROGRESS_DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_progress?schema=public
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_progress?schema=public
      REDIS_URL: redis://redis:6379
      PROGRESS_PORT: 3007
      USER_SERVICE_URL: http://user-service:3009
      AI_PIPELINE_URL: http://ai-pipeline:3004
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # F22 #8: shared token authorizing the server-to-server call to ai-pipeline.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ../../
      dockerfile: services/notification-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://notification-service:3008).
      - "127.0.0.1:3008:3008"
    environment:
      NOTIF_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_notifications?schema=public
      NOTIF_DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_notifications?schema=public
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_notifications?schema=public
      REDIS_URL: redis://redis:6379
      NOTIF_PORT: 3008
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # Shared server-to-server token guarding /v1/notifications/internal/*
      # (GDPR purge). Same INTERNAL_SERVICE_TOKEN value shared across services.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-VAPID_PLACEHOLDER_PUBLIC}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-VAPID_PLACEHOLDER_PRIVATE}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@nightfuel.app}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  exercise-service:
    build:
      context: ../../
      dockerfile: services/exercise-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://exercise-service:3011).
      - "127.0.0.1:3011:3011"
    environment:
      EXERCISE_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_exercise?schema=public
      EXERCISE_DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_exercise?schema=public
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_exercise?schema=public
      REDIS_URL: redis://redis:6379
      EXERCISE_PORT: 3011
      AI_PIPELINE_URL: http://ai-pipeline:3004
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # F22 #8: shared token authorizing the server-to-server call to ai-pipeline.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  sleep-service:
    build:
      context: ../../
      dockerfile: services/sleep-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://sleep-service:3012).
      - "127.0.0.1:3012:3012"
    environment:
      SLEEP_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_sleep?schema=public
      SLEEP_DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_sleep?schema=public
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_sleep?schema=public
      REDIS_URL: redis://redis:6379
      SLEEP_PORT: 3012
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # F36 GDPR purge: verifies X-Internal-Token on DELETE /internal/user/:userId
      # (erases sleep_sessions + health_samples). Fails closed if empty.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  subscription-service:
    build:
      context: ../../
      dockerfile: services/subscription-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://subscription-service:3010).
      - "127.0.0.1:3010:3010"
    environment:
      SUB_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_subscriptions?schema=public
      SUB_DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_subscriptions?schema=public
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_subscriptions?schema=public
      REDIS_URL: redis://redis:6379
      SUB_PORT: 3010
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # F36 GDPR purge: verifies X-Internal-Token on DELETE /internal/user/:userId
      # (erases subscriptions + iap_transactions billing PII). Fails closed if empty.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      APPLE_SHARED_SECRET: ${APPLE_SHARED_SECRET:-}
      # HIGH #3: accept Apple/Google SANDBOX receipts. Default false — a sandbox
      # (StoreKit-test / TestFlight) receipt must NEVER upgrade a real account in
      # production. Set to true only in non-prod test environments.
      IAP_ALLOW_SANDBOX: ${IAP_ALLOW_SANDBOX:-false}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  community-service:
    build:
      context: ../../
      dockerfile: services/community-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://community-service:3013).
      - "127.0.0.1:3013:3013"
    environment:
      COMMUNITY_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_community?schema=public
      COMMUNITY_DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_community?schema=public
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_community?schema=public
      REDIS_URL: redis://redis:6379
      COMMUNITY_PORT: 3013
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      USER_SERVICE_URL: http://user-service:3009
      # GDPR purge: shared token the server-to-server-only
      # /v1/community/internal/* routes verify (makeInternalAuthGuard). Same
      # INTERNAL_SERVICE_TOKEN value shared across services.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  chat-service:
    build:
      context: ../../
      dockerfile: services/chat-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://chat-service:3014).
      - "127.0.0.1:3014:3014"
    environment:
      CHAT_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_chat?schema=public
      CHAT_DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_chat?schema=public
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_chat?schema=public
      REDIS_URL: redis://redis:6379
      CHAT_PORT: 3014
      AI_PIPELINE_URL: http://ai-pipeline:3004
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # F22 #8: shared token authorizing the server-to-server call to ai-pipeline.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  state-service:
    build:
      context: ../../
      dockerfile: services/state-service/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://state-service:3015).
      - "127.0.0.1:3015:3015"
    environment:
      STATE_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_state?schema=public
      STATE_DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_state?schema=public
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_state?schema=public
      REDIS_URL: redis://redis:6379
      STATE_PORT: 3015
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # F36 GDPR purge: verifies X-Internal-Token on DELETE /internal/user/:userId
      # (erases derived user_state). Fails closed if empty.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  decision-engine:
    build:
      context: ../../
      dockerfile: services/decision-engine/Dockerfile
    ports:
      # F34 #2: localhost-only (reached internally as http://decision-engine:3016).
      - "127.0.0.1:3016:3016"
    environment:
      REDIS_URL: redis://redis:6379
      DECISION_PORT: 3016
      # decision-engine is Redis-only but the shared @nightfuel/config schema
      # requires DATABASE_URL to be present; it is validated, not used.
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nightfuel_state?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Web Client (Next.js 15) ────────────────────────────────────────────────
  web:
    build:
      context: ../../clients/web
      dockerfile: Dockerfile
    ports:
      # F34 #2: localhost-only. The web client is built to call the API via the
      # nginx gateway (NEXT_PUBLIC_API_URL=http://nginx/api), so the host port is
      # only for local browsing; front it with the host nginx like 8080.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://nginx/api
      NEXT_PUBLIC_WS_URL: ws://nginx
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-VAPID_PLACEHOLDER_PUBLIC}
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres_data:
