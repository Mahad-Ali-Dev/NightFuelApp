events {
    worker_connections 1024;
}

http {
    # Resolve upstream service names via Docker's embedded DNS at request time.
    # Without this, nginx caches each upstream IP at startup and returns 502 after
    # a service container is recreated (compose up gives it a new IP). The variable
    # proxy_pass below forces re-resolution (valid=10s).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket upgrade map: send "Connection: upgrade" only for a real WS handshake,
    # otherwise "close". Without this, a plain HTTP request to a WS-capable location
    # gets "Connection: upgrade" with an empty Upgrade header and the upstream hangs
    # waiting for a protocol switch that never comes (the request times out).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Emit RELATIVE redirects (Location: /path, not http://host/path) so a 301 from a
    # slash-less collection path keeps the client on its original scheme://host:port
    # (the device's :8080) instead of dropping the port and bouncing to bad HTTPS.
    absolute_redirect off;

    # Common proxy headers (inherited by locations that declare no proxy_set_header).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sane default request-body cap for the whole gateway. JSON API payloads are
    # small; this stops an oversized body from being buffered and forwarded to any
    # upstream. The paid-LLM /v1/ai location tightens this further (256k below).
    client_max_body_size 1m;

    server {
        listen 80;

        # ── Edge security gate (evaluated BEFORE the prefix proxy blocks) ───────
        # nginx location precedence: exact (=) and regex (~) locations are matched
        # before plain prefix locations, so these blocks win over the /v1/<svc>
        # proxy blocks below regardless of their position in the file.

        # Kill ALL server-to-server-only "/internal/" routes from the public edge.
        # These (e.g. /v1/users/internal/*, /v1/plans/internal/*) are reached
        # directly over the Docker network by sibling services and are NOT meant to
        # be authenticated at the gateway — exposing them leaks PII (CRITICAL).
        # The regex matches one service segment, then a literal "internal" segment:
        # it hits /v1/users/internal[/...] but NOT /v1/users/public/... nor
        # /v1/community/badges/... (no "internal" segment there).
        location ~ /v1/[^/]+/internal(/|$) { return 404; }

        # Server-to-server-only POST routes. Confirmed by inspection that the mobile
        # app (clients/mobile/src/api/*) never calls these: progress.ts uses
        # /v1/progress/{today,reports,weekly-audit,hydration,streak,weekly-stats,
        # metrics,history,stats} (no ai-usage); community.ts uses
        # /v1/community/badges{,/mine,/unseen,/user/:id} (no /award). Exact-match
        # (=) locations 404 the precise path with highest precedence.
        location = /v1/progress/ai-usage      { return 404; }
        location = /v1/community/badges/award  { return 404; }

        # NOTE: prefix locations intentionally have NO trailing slash. A prefix
        # location ending in "/" makes nginx 301-redirect the slash-less form
        # (e.g. POST /v1/exercises -> /v1/exercises/), which breaks POST bodies on
        # the client. Without the trailing slash, bare collection paths proxy directly.
        location /v1/auth          { set $u "auth-service:3001";         proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }
        location /v1/shifts        { set $u "shift-service:3002";        proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }
        location /v1/circadian     { set $u "circadian-engine:3003";     proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }
        # ai-pipeline now requires auth (F22 #8): mobile calls /v1/ai/chat/stream
        # directly with a Bearer JWT, so the Authorization header MUST reach the
        # upstream. nginx forwards client request headers by default, but we set
        # it explicitly so a future header rewrite here can't silently strip it.
        # Do NOT block /v1/ai — mobile depends on the streaming chat endpoint.
        location /v1/ai            { set $u "ai-pipeline:3004";          proxy_pass http://$u$request_uri; proxy_set_header Authorization $http_authorization; proxy_read_timeout 60s; client_max_body_size 256k; }
        location /v1/plans         { set $u "plan-service:3005";         proxy_pass http://$u$request_uri; proxy_read_timeout 60s; }
        location /v1/meals         { set $u "meal-service:3006";         proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }
        location /v1/progress      { set $u "progress-service:3007";     proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }
        location /v1/users         { set $u "user-service:3009";         proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }
        location /v1/sleep         { set $u "sleep-service:3012";        proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }
        location /v1/exercises     { set $u "exercise-service:3011";     proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }
        location /v1/subscriptions { set $u "subscription-service:3010"; proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }
        location /v1/community     { set $u "community-service:3013";    proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }
        location /v1/coaches       { set $u "chat-service:3014";         proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }
        # state-service is consumed server-to-server by plan-service only; the
        # mobile app never calls /v1/state (confirmed: no '/v1/state' usage in
        # clients/mobile). 404 it at the public edge — sibling services still
        # reach state-service directly over the Docker network.
        location /v1/state         { return 404; }
        location /v1/decision      { set $u "decision-engine:3016";      proxy_pass http://$u$request_uri; proxy_read_timeout 30s; }

        # WebSocket-capable endpoints repeat the headers (a location with any
        # proxy_set_header does not inherit the http-level ones).
        location /v1/notifications/ {
            set $u "notification-service:3008";
            proxy_pass http://$u$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 60s;
        }
        location /v1/chat/ {
            set $u "chat-service:3014";
            proxy_pass http://$u$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 60s;
        }

        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
