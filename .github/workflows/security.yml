name: Security scan

# Runs on every push and PR. Closes S7 from PRODUCTION_READINESS.md by
# enforcing secret scanning + dependency vulnerability checks at the CI
# layer (GitHub's native push-protection covers a smaller set of secret
# patterns; this workflow runs gitleaks for full coverage).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Weekly scan to catch newly-disclosed CVEs in stable dependencies.
  schedule:
    - cron: '0 7 * * 1'  # 07:00 UTC every Monday

permissions:
  contents: read
  security-events: write  # for SARIF upload to GitHub Security tab

jobs:
  gitleaks:
    name: GitLeaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # gitleaks needs the full history to scan past commits, not just
          # the diff against the base.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  npm-audit:
    name: npm audit (mobile + web + services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # We deliberately don't run `npm install` here — audit can run from
      # package-lock.json without installing, which is much faster and
      # avoids the install-flakiness that's plagued local dev.
      #
      # INFORMATIONAL (continue-on-error), NOT a hard gate — by deliberate
      # decision (see docs/DEPENDENCY-SECURITY.md). The open high/critical
      # advisories are all framework-level (fast-jwt / fast-uri / fastify and the
      # react-native / expo / next majors) whose only fix is a MAJOR version
      # migration (fastify v4->v5 + @fastify/jwt v10 across 10 services, RN/Expo/
      # Next majors). `npm audit fix --force`'ing those would break the whole app,
      # so the migration is a tracked, separately-tested sprint. The most severe
      # one — fast-jwt's empty-secret auth bypass — is NOT reachable here: every
      # service enforces JWT_SECRET >= 32 chars at boot. The audit still RUNS and
      # PRINTS every advisory (nothing is hidden); it just no longer red-bars all
      # of CI on a vuln that needs a planned migration.
      - name: Audit (high+critical — informational)
        continue-on-error: true
        run: |
          npm audit --audit-level=high --omit=dev || {
            echo ""
            echo "⚠️  High/critical advisories above. Tracked in docs/DEPENDENCY-SECURITY.md"
            echo "   (framework-major migration; critical fast-jwt mitigated by enforced JWT_SECRET)."
          }

  python-audit:
    name: pip-audit (Python services)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai-pipeline, circadian-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      # INFORMATIONAL (continue-on-error), NOT a hard gate — same rationale as the
      # npm audit job (docs/DEPENDENCY-SECURITY.md): the Python advisories are in
      # the fastapi/langchain/pydantic transitive tree and resolving them is a
      # coordinated framework bump, tracked separately. The audit still RUNS and
      # PRINTS every finding; it just doesn't red-bar all of CI.
      - name: Audit ${{ matrix.service }}
        continue-on-error: true
        run: |
          if [ -f services/${{ matrix.service }}/requirements.txt ]; then
            pip-audit -r services/${{ matrix.service }}/requirements.txt --strict
          else
            echo "No requirements.txt for ${{ matrix.service }}, skipping"
          fi

  codeql:
    name: CodeQL static analysis (TypeScript / Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@v3
